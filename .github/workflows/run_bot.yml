name: Run Football Bot

on:
  schedule:
    # Chạy tự động mỗi ngày từ 22h00 đến 3h00 sáng giờ Việt Nam (tương ứng 15h - 20h UTC)
    - cron: '0 15-20 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Run bot script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_KEYS: ${{ secrets.API_KEYS }}
        run: |
          python bot.py
